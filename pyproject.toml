[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-pre"
version = "0.1.0"
description = "DINOv3 注意力驱动的实时双主色提取（焦点色 / 氛围色）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 核心依赖刻意保持轻量：无 torch 也能跑通 mock 全链路（CI / 自检友好）
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 真模型推理：torch 建议按 https://pytorch.org 官方索引装 CUDA 版
model = ["torch>=2.1", "transformers>=4.56"]
ws = ["websockets>=12"]

[dependency-groups]
# PEP 735 开发依赖组：uv sync 默认同步 dev 组
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cognition-pre = "cognition_pre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# BLE001/S110：sinks 之间相互隔离、doctor 探测可选依赖，故意宽捕获
ignore = ["BLE001", "S110"]
